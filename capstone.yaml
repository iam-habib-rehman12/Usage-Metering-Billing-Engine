name: flyrank-capstone-metering-billing
run: docker compose up --build
seed: docker compose exec api python -m scripts.seed
test: docker compose run --rm api pytest -q
base_url: http://localhost:8000
endpoints:
  health: GET /health
  billable_action: POST /generate
  usage: GET /usage
  checkout: POST /checkout
  stripe_webhook: POST /webhooks/stripe
  reconciliation: POST /jobs/reconcile
