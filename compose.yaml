services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - billingdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  billingdata:

